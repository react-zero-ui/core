packages:
  - packages/*
  - examples/*

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - sharp

strictPeerDependencies: true

publicHoistPattern:
  - "*eslint*"
  - "*typescript*"

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@react-zero-ui/icon-sprite@0.4.2'
